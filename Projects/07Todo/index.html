<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div id="container">
            <nav id="heading">
                <h1>My Todo List</h1>
                <input
                    type="text"
                    id="todo-value"
                    placeholder="Enter a task..."
                />
                <button id="addBtn">Add</button>
                <p id="message"></p>
            </nav>
            <main>
                <ul id="todo-list"></ul>
            </main>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
