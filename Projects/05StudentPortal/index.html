<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <script src="./script.js" defer></script>
        <title>Student Portal</title>
    </head>
    <body>
        <div id="container">
            <header>Student Portal</header>

            <main>
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Search" />
                    <button id="search-btn">Search</button>
                </div>

                <div class="sort-raw">
                    <button id="sort-az">Sort A->Z</button>
                    <button id="sort-za">Sort Z->A</button>
                    <button id="sort-marks">Sort By Marks</button>
                    <button id="sort-passing">Sort By Passing</button>
                    <button id="sort-class">Sort by Class</button>
                    <button id="sort-gender">Sort By Gender</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Gender</th>
                            <th>Class</th>
                            <th>Marks</th>
                            <th>Passing</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </main>
        </div>
    </body>
</html>
